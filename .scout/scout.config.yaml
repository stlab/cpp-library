ignore:
- '**/CHANGELOG.md'
- '**/CHANGELOG*'
- '**/CHANGES.md'
- '**/HISTORY.md'
- .claude/worktrees/
- '**/build/'
- '**/CMakeFiles/'
- .cache/
- .scout/
dampen:
- factor: 0.3
  patterns:
  - '**/package.json'
- factor: 0.8
  patterns:
  - tests/
  - .github/
- factor: 0.5
  patterns:
  - tests/install/fixtures/
  - tests/setup/fixtures/
  - tests/docs/fixtures/
  - docs/superpowers/
boost:
- factor: 1.3
  patterns:
  - cmake/
  - cpp-library.cmake
  - setup.cmake
tune:
  rerank_candidates_ident: 25
  rerank_evidence_budget_nl: 600
  rerank_evidence_budget_ident: 800
  rrf_semantic_weight_nl: 0.8
  prf_top_k: 5
  prf_confidence_threshold: 0.6
  learned_ranker_model_path: bundled:v27
  learned_ranker_calibrated_blend: true
